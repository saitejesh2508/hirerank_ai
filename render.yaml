services:
  - type: web
    name: hirerank-ai-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt && cd backend && alembic upgrade head
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hirerank-ai-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: hirerank-uploads
      mountPath: /var/data
      sizeGB: 1
  - type: web
    name: hirerank-ai-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
databases:
  - name: hirerank-ai-postgres
    databaseName: hirerank_ai
    user: hirerank
    plan: basic-256mb
